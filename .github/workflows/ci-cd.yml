# ============================================================
#  НАЗВАНИЕ РАБОЧЕГО ПРОЦЕССА
# ============================================================
name: CI/CD

# ============================================================
#  ТРИГГЕРЫ
# ============================================================
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ------------------------------------------------------------
  #  JOB 1: CI
  # ------------------------------------------------------------
  ci:
    name: CI - Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./... -short

      - name: Build Auth Service (smoke test)
        run: go build -v ./services/auth/cmd/...

      - name: Build Gateway Service (smoke test)
        run: go build -v ./services/gateway/cmd/...

      - name: Build Profiles Service (smoke test)
        run: go build -v ./services/profiles/cmd/...

      - name: Build Exercises Service (smoke test)
        run: go build -v ./services/exercises/cmd/...

  # ------------------------------------------------------------
  #  JOB 2: CD
  # ------------------------------------------------------------
  cd:
    name: CD - Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Определяем, какие сервисы изменились
      - name: Get changed services
        id: changed-services
        uses: tj-actions/changed-files@v44
        with:
          files: |
            services/auth/**
            services/gateway/**
            services/profiles/**
            services/exercises/**
            .github/workflows/ci-cd.yml
            pkg/**
            go.mod
            go.sum

      # Build & push Auth
      - name: Build and push Auth image
        if: steps.changed-services.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/auth/Dockerfile
          push: true
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/auth:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/auth:${{ github.sha }}

      # Build & push Gateway
      - name: Build and push Gateway image
        if: steps.changed-services.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/gateway/Dockerfile
          push: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/gateway:${{ github.sha }}

      # Build & push Profiles
      - name: Build and push Profiles image
        if: steps.changed-services.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/profiles/Dockerfile
          push: true
          cache-from: type=gha,scope=profiles
          cache-to: type=gha,mode=max,scope=profiles
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/profiles:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/profiles:${{ github.sha }}

      # Build & push Exercises
      - name: Build and push Exercises image
        if: steps.changed-services.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/exercises/Dockerfile
          push: true
          cache-from: type=gha,scope=exercises
          cache-to: type=gha,mode=max,scope=exercises
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/exercises:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/exercises:${{ github.sha }}

      # Деплой на сервер
      - name: Deploy to production server
        if: steps.changed-services.outputs.any_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR="/root/projects/orange-team-microservices"

            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }} $PROJECT_DIR
            fi

            cd $PROJECT_DIR
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull auth
            docker compose pull gateway
            docker compose pull profiles
            docker compose pull exercises

            docker compose up -d --no-build auth gateway profiles exercises

            docker image prune -f