# ============================================================
#  НАЗВАНИЕ РАБОЧЕГО ПРОЦЕССА
# ============================================================
name: CI/CD

# ============================================================
#  ТРИГГЕРЫ
# ============================================================
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COMPOSE_FILE: infra/docker-compose.yml
  COMPOSE_ENV_FILES: .env

jobs:

# ------------------------------------------------------------
#  JOB 1: CI
# ------------------------------------------------------------
  ci:
    name: CI - Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./... -short

      - name: Build Auth Service (smoke test)
        run: go build -v ./services/auth/cmd/...

      - name: Build Gateway Service (smoke test)
        run: go build -v ./services/gateway/cmd/...

      - name: Build Profiles Service (smoke test)
        run: go build -v ./services/profiles/cmd/...

      - name: Build Exercises Service (smoke test)
        run: go build -v ./services/exercises/cmd/...

      - name: Run Integration Tests
        run: go test -tags=integration -v -timeout=15m ./...

# ------------------------------------------------------------
#  JOB 2: Detect changed services
# ------------------------------------------------------------
  changed-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed services
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            api/**
            internal/gen/**
            services/**
            scripts/**
            pkg/**
            .github/workflows/ci-cd.yml
            docker-compose.yml
            Caddyfile
            prometheus.yml
            promtail-config.yml
            alertmanager.yml
            alerts.yml
            loki-config.yml
            Taskfile.yml
            go.mod
            go.sum
  
# ------------------------------------------------------------
#  JOB 3: Build & Push (matrix)
# ------------------------------------------------------------
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changed-services
    if: needs.changed-services.outputs.any_changed == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, gateway, profiles, exercises]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ github.sha }}

# ------------------------------------------------------------
#  JOB 4: Deploy to production
# ------------------------------------------------------------
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: [changed-services, build-and-push]
    if: needs.changed-services.outputs.any_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          curl -L https://github.com/getsops/sops/releases/download/v3.10.1/sops-v3.10.1.linux.amd64 -o /tmp/sops
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Decrypt .env and rclone.conf files
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops --decrypt --input-type dotenv --filename-override .env .env.enc > .env
          sops --decrypt --input-type dotenv --filename-override services/auth/.env services/auth/.env.enc > services/auth/.env
          sops --decrypt --input-type dotenv --filename-override services/gateway/.env services/gateway/.env.enc > services/gateway/.env
          sops --decrypt --input-type dotenv --filename-override services/profiles/.env services/profiles/.env.enc > services/profiles/.env
          sops --decrypt --input-type dotenv --filename-override services/exercises/.env services/exercises/.env.enc > services/exercises/.env
          sops --decrypt --input-type binary --filename-override scripts/rclone.conf scripts/rclone.conf.enc > scripts/rclone.conf

      - name: Upload .env and rclone.conf files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env,services/auth/.env,services/gateway/.env,services/profiles/.env,services/exercises/.env,scripts/rclone.conf"
          target: "/root/projects/orange-team-microservices"
          overwrite: true

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR="/root/projects/orange-team-microservices"

            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }} $PROJECT_DIR
            fi

            # Создать файлы с секретами для Alertmanager из расшифрованного .env.
            # Alertmanager не умеет ${VAR} в конфиге — читает значения из файлов
            # через bot_token_file / chat_id_file.
            if [ -f "$PROJECT_DIR/.env" ]; then
              set -a
              . "$PROJECT_DIR/.env"
              set +a

              mkdir -p "$PROJECT_DIR/secrets"
              printf '%s' "$TELEGRAM_BOT_TOKEN" > "$PROJECT_DIR/secrets/bot_token"
              printf '%s' "$TELEGRAM_CHAT_ID"   > "$PROJECT_DIR/secrets/chat_id"
              chmod 644 "$PROJECT_DIR/secrets/bot_token" "$PROJECT_DIR/secrets/chat_id"
              echo "→ Alertmanager secrets written to $PROJECT_DIR/secrets/"
            fi

            # Разложить rclone.conf по дефолтному пути, чтобы cron и скрипт
            # backup-db.sh находили его без --config.
            if [ -f "$PROJECT_DIR/scripts/rclone.conf" ]; then
              mkdir -p /root/.config/rclone
              mv "$PROJECT_DIR/scripts/rclone.conf" /root/.config/rclone/rclone.conf
              chmod 600 /root/.config/rclone/rclone.conf
              echo "→ rclone.conf installed to ~/.config/rclone/"
            fi

            cd $PROJECT_DIR
            git pull origin main

            # COMPOSE_FILE / COMPOSE_ENV_FILES не передаются с раннера
            # через SSH — выставляем их явно в shell на сервере.
            export COMPOSE_FILE=infra/docker-compose.yml
            export COMPOSE_ENV_FILES=.env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Validate .env files against .env.example before starting
            # containers. Catches missing variables early with a clear
            # error instead of a cryptic envconfig panic on startup.
            for svc in auth gateway profiles exercises; do
              if [ -f "$PROJECT_DIR/services/$svc/.env.example" ] && [ -f "$PROJECT_DIR/services/$svc/.env" ]; then
                echo "→ Validating services/$svc/.env"
                missing=$(comm -23 \
                  <(grep -vE '^\s*#|^\s*$' "$PROJECT_DIR/services/$svc/.env.example" | cut -d= -f1 | sort -u) \
                  <(grep -vE '^\s*#|^\s*$' "$PROJECT_DIR/services/$svc/.env"          | cut -d= -f1 | sort -u) \
                )
                if [ -n "$missing" ]; then
                  echo "❌ Missing vars in services/$svc/.env:"
                  echo "$missing"
                  exit 1
                fi
              fi
            done

            docker compose pull

            # --force-recreate: docker compose не отслеживает изменения
            # содержимого монтируемых конфигов (alertmanager.yml, prometheus.yml,
            # Caddyfile, promtail-config.yml). Без флага контейнеры не
            # пересоздаются, и правки конфигов не применяются до ручного
            # вмешательства. См. ADR-012.
            docker compose up -d --no-build --force-recreate

            docker image prune -f

# ------------------------------------------------------------
#  JOB 5: Smoke test production
# ------------------------------------------------------------
  smoke-test:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.changed-services.outputs.any_changed == 'true'
    steps:
      - name: Wait for services and run smoke tests
        run: |
          set -euo pipefail

          BASE_URL="https://sololevelingms.duckdns.org"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=6

          echo "→ Waiting for services to become available..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -sf -o /dev/null "$BASE_URL/health"; then
              echo "  services are up (attempt $i)"
              break
            fi
            if [ "$i" = "$MAX_ATTEMPTS" ]; then
              echo "  services did not become available in $((MAX_ATTEMPTS * SLEEP_SECONDS))s"
              exit 1
            fi
            echo "  attempt $i failed, retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

          echo "→ Smoke test: /health"
          curl -sf "$BASE_URL/health" | grep -q '"status":"ok"' || {
            echo "  /health did not return status:ok"
            exit 1
          }
          echo "  OK"

          echo "→ Smoke test: /ready"
          curl -sf "$BASE_URL/ready" | grep -q '"status":"ok"' || {
            echo "  /ready did not return status:ok"
            exit 1
          }
          echo "  OK"

          echo "→ Smoke test: /login with invalid credentials returns 401"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE_URL/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-test@example.invalid","password":"wrongpassword123"}')

          if [ "$HTTP_CODE" != "401" ]; then
            echo "  expected 401, got $HTTP_CODE"
            exit 1
          fi
          echo "  OK (401 as expected)"

          echo "→ All smoke tests passed"

# ------------------------------------------------------------
#  JOB 6: Notify Telegram
# ------------------------------------------------------------
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [ci, changed-services, build-and-push, deploy, smoke-test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          curl -L https://github.com/getsops/sops/releases/download/v3.10.1/sops-v3.10.1.linux.amd64 -o /tmp/sops
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Extract telegram credentials from .env.enc
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=$(sops --decrypt --input-type dotenv --extract '["TELEGRAM_BOT_TOKEN"]' .env.enc)" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=$(sops --decrypt --input-type dotenv --extract '["TELEGRAM_CHAT_ID"]' .env.enc)" >> $GITHUB_ENV

      - name: Send notification
        env:
          CI_RESULT:      ${{ needs.ci.result }}
          CHANGED_RESULT: ${{ needs.changed-services.result }}
          CHANGED:        ${{ needs.changed-services.outputs.any_changed }}
          BUILD_RESULT:   ${{ needs.build-and-push.result }}
          DEPLOY_RESULT:  ${{ needs.deploy.result }}
          SMOKE_RESULT:   ${{ needs.smoke-test.result }}
          REPO:           ${{ github.repository }}
          COMMIT_SHA:     ${{ github.sha }}
          COMMIT_MSG:     ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR:  ${{ github.event.head_commit.author.name }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER:     ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Итоговый статус
          if [ "$CI_RESULT" != "success" ]; then
            ICON="❌"
            TITLE="CI failed"
          elif [ "$CHANGED" != "true" ]; then
            ICON="⏭️"
            TITLE="Nothing to deploy"
          elif [ "$DEPLOY_RESULT" = "success" ] && [ "$SMOKE_RESULT" = "success" ]; then
            ICON="✅"
            TITLE="Deploy success"
          else
            ICON="❌"
            TITLE="Deploy failed"
          fi

          # Первый упавший job (если есть)
          FAILED=""
          for pair in \
              "ci:${CI_RESULT}" \
              "changed-services:${CHANGED_RESULT}" \
              "build-and-push:${BUILD_RESULT}" \
              "deploy:${DEPLOY_RESULT}" \
              "smoke-test:${SMOKE_RESULT}"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" = "failure" ] && [ -z "$FAILED" ]; then
              FAILED="$name"
            fi
          done

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG_SHORT="$(printf '%s' "$COMMIT_MSG" | head -n 1 | cut -c1-100)"

          # Собираем сообщение
          MESSAGE="<b>${ICON} ${TITLE}</b>"
          MESSAGE+=$'\n\n'
          MESSAGE+="<b>Repo:</b> ${REPO}"
          MESSAGE+=$'\n'
          MESSAGE+="<b>Commit:</b> <code>${SHORT_SHA}</code> — ${COMMIT_MSG_SHORT}"
          MESSAGE+=$'\n'
          MESSAGE+="<b>Author:</b> ${COMMIT_AUTHOR}"
          if [ -n "$FAILED" ]; then
            MESSAGE+=$'\n'
            MESSAGE+="<b>Failed job:</b> ${FAILED}"
          fi
          MESSAGE+=$'\n'
          MESSAGE+="<a href=\"${RUN_URL}\">Run #${RUN_NUMBER}</a>"

          # Отправляем
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Telegram API returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "→ Notification sent to Telegram"