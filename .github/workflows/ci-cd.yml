# ============================================================
#  НАЗВАНИЕ РАБОЧЕГО ПРОЦЕССА
# ============================================================
name: CI/CD

# ============================================================
#  ТРИГГЕРЫ
# ============================================================
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

# ------------------------------------------------------------
#  JOB 1: CI
# ------------------------------------------------------------
  ci:
    name: CI - Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./... -short

      - name: Build Auth Service (smoke test)
        run: go build -v ./services/auth/cmd/...

      - name: Build Gateway Service (smoke test)
        run: go build -v ./services/gateway/cmd/...

      - name: Build Profiles Service (smoke test)
        run: go build -v ./services/profiles/cmd/...

      - name: Build Exercises Service (smoke test)
        run: go build -v ./services/exercises/cmd/...

      - name: Run Integration Tests
        run: go test -tags=integration -v -timeout=15m ./...

# ------------------------------------------------------------
#  JOB 2: Detect changed services
# ------------------------------------------------------------
  changed-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed services
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            services/auth/**
            services/gateway/**
            services/profiles/**
            services/exercises/**
            .github/workflows/ci-cd.yml
            pkg/**
            go.mod
            go.sum
  
# ------------------------------------------------------------
#  JOB 3: Build & Push (matrix)
# ------------------------------------------------------------
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changed-services
    if: needs.changed-services.outputs.any_changed == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, gateway, profiles, exercises]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ github.sha }}

# ------------------------------------------------------------
#  JOB 4: Deploy to production
# ------------------------------------------------------------
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: [changed-services, build-and-push]
    if: needs.changed-services.outputs.any_changed == 'true'
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR="/root/projects/orange-team-microservices"

            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }} $PROJECT_DIR
            fi

            cd $PROJECT_DIR
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull auth gateway profiles exercises

            docker compose up -d --no-build auth gateway profiles exercises

            docker image prune -f