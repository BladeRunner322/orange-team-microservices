global:
  # 15s — компромисс для прода и 7+ сервисов.
  # 5s — только для локальной отладки (быстрая обратная связь по метрикам).
  scrape_interval: 15s

# Правила алертов. Файл монтируется в контейнер через docker-compose.
rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager — получатель алертов. Внутри docker-сети, по имени сервиса.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'auth'
    static_configs:
      - targets: ['auth:8080']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8081']

  - job_name: 'profiles'
    static_configs:
      - targets: ['profiles:8080']

  - job_name: 'exercises'
    static_configs:
      - targets: ['exercises:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']