global:
  # 15s — компромисс для прода и 7+ сервисов.
  # 5s — только для локальной отладки (быстрая обратная связь по метрикам).
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth'
    static_configs:
      - targets: ['auth:8080']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8081']
  
  - job_name: 'profiles'
    static_configs:
      - targets: ['profiles:8080']

  - job_name: 'exercises'
    static_configs:
      - targets: ['exercises:8080']