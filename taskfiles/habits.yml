version: '3'

tasks:
  run:
    desc: 'Run habits locally (auto-starts postgres + runs migrations)'
    deps: [generate]
    cmds:
      - docker compose up -d postgres-habits
      - docker compose run --rm migrate-habits
      - env GRPC_PORT=:50064 POSTGRES_HOST=localhost POSTGRES_PORT=5435 ENABLE_TLS=true TLS_CERT_FILE=./certs/server.crt TLS_KEY_FILE=./certs/server.key HTTP_PORT=:8094 go run services/habits/cmd/main.go

  logs:
    desc: Show Habits service logs
    cmds: [docker compose logs -f habits]

  psql:
    desc: Open psql console for Habits database
    cmds:
      - docker compose exec postgres-habits sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

  migrate-create:
    desc: 'Create a new migration for Habits (usage: task habits:migrate-create -- create_habits)'
    cmds:
      - docker compose run --rm --entrypoint migrate migrate-habits create -ext sql -dir /migrations -seq {{.CLI_ARGS}}