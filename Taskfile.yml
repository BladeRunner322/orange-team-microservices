version: '3'
dotenv: ['.env']

tasks:

  # ============================================================
  #  ОБЩИЕ ЗАДАЧИ (генерация, тесты, TLS)
  # ============================================================

  generate:
    desc: Generate gRPC code from proto files
    cmds:
      - protoc -I api --go_out=. --go-grpc_out=. api/auth/auth.proto

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  vendor:
    desc: Update vendor directory with current dependencies
    cmds:
      - go mod vendor

  gen-certs:
    desc: Generate self-signed TLS certificates for development
    cmds:
      - mkdir -p certs
      - openssl req -x509 -newkey rsa:4096 -keyout certs/server.key -out certs/server.crt -days 365 -nodes -subj "/CN=localhost"

  test:
    desc: Run all unit tests with verbose output
    cmds:
      - go test -v ./...

  test-cover:
    desc: Run tests with coverage report
    cmds:
      - mkdir -p coverage
      - go test -v -coverprofile=coverage/coverage.out ./...
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "Coverage report saved to coverage/coverage.html"

  test-integration:
    desc: Run integration tests with Testcontainers
    cmds:
      - go test -tags=integration -v ./...

  test-all:
    desc: Run unit and integration tests
    cmds:
      - task: test
      - task: test-integration

  # ============================================================
  #  AUTH SERVICE – ЛОКАЛЬНЫЙ ЗАПУСК
  # ============================================================

  auth:run:
    desc: Run auth service locally
    deps: [generate, tidy]
    cmds:
      - env GRPC_PORT=:50061 POSTGRES_HOST=localhost ENABLE_TLS=true TLS_CERT_FILE=./certs/server.crt TLS_KEY_FILE=./certs/server.key HTTP_PORT=:8090 go run services/auth/cmd/main.go


  # ============================================================
  #  AUTH SERVICE – DOCKER
  # ============================================================

  auth:build:
    desc: Build Auth service Docker image
    cmds:
      - docker compose build auth

  auth:rebuild:
    desc: Rebuild Auth service with fresh vendor and no cache
    deps: [vendor]
    cmds:
      - docker compose build auth --no-cache

  auth:up:
    desc: Start Auth service with all dependencies (postgres + migrations + auth)
    cmds:
      - docker compose up -d postgres-auth migrate-auth auth

  auth:down:
    desc: Stop Auth service container
    cmds:
      - docker compose down auth

  auth:restart:
    desc: Restart Auth service (rebuild without cache and start)
    deps: [vendor]
    cmds:
      - docker compose build auth --no-cache
      - docker compose up -d auth

  auth:logs:
    desc: Show Auth service logs
    cmds:
      - docker compose logs -f auth

  # ============================================================
  #  AUTH SERVICE – POSTGRES
  # ============================================================

  auth:postgres-up:
    desc: Start PostgreSQL for Auth service
    cmds:
      - docker compose up -d postgres-auth

  auth:postgres-down:
    desc: Stop PostgreSQL for Auth service
    cmds:
      - docker compose down postgres-auth

  auth:postgres-logs:
    desc: Show PostgreSQL logs for Auth
    cmds:
      - docker compose logs -f postgres-auth

  auth:postgres-psql:
    desc: Open psql console for Auth database
    cmds:
      - docker compose exec postgres-auth psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}

  # ============================================================
  #  AUTH SERVICE – REDIS
  # ============================================================

  auth:redis-up:
    desc: Start Redis for Auth service
    cmds:
      - docker compose up -d redis-auth

  auth:redis-down:
    desc: Stop Redis for Auth service
    cmds:
      - docker compose down redis-auth

  auth:redis-logs:
    desc: Show Redis logs for Auth
    cmds:
      - docker compose logs -f redis-auth

  auth:redis-cli:
    desc: Open redis-cli
    cmds:
      - docker compose exec redis-auth redis-cli

  # ============================================================
  #  AUTH SERVICE – МИГРАЦИИ
  # ============================================================

  auth:migrate-create:
    desc: Create a new migration for Auth
    cmds:
      - docker compose run --rm migrate-auth create -ext sql -dir /migrations -seq {{.CLI_ARGS}}

  auth:migrate-up:
    desc: Apply all pending migrations for Auth
    cmds:
      - docker compose run --rm migrate-auth -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB}?sslmode=disable" up

  auth:migrate-down:
    desc: Rollback the last migration for Auth
    cmds:
      - docker compose run --rm migrate-auth -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB}?sslmode=disable" down {{.CLI_ARGS}}

  auth:migrate-version:
    desc: Show current migration version for Auth
    cmds:
      - docker compose run --rm migrate-auth -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB}?sslmode=disable" version

  # ============================================================
  #  GATEWAY SERVICE – ЛОКАЛЬНЫЙ ЗАПУСК
  # ============================================================

  gateway:run:
    desc: Run gateway service locally
    deps: [generate, tidy]
    cmds:
      - GATEWAY_HTTP_PORT=:8091 AUTH_GRPC_ADDR=localhost:50061 go run services/gateway/cmd/main.go

  # ============================================================
  #  GATEWAY SERVICE – DOCKER
  # ============================================================

  gateway:build:
    desc: Build Gateway service Docker image
    cmds:
      - docker compose build gateway

  gateway:rebuild:
    desc: Rebuild Gateway with fresh vendor and no cache
    deps: [vendor]
    cmds:
      - docker compose build gateway --no-cache

  gateway:up:
    desc: Start Gateway service (assumes image is already built)
    cmds:
      - docker compose up -d gateway

  gateway:down:
    desc: Stop Gateway service
    cmds:
      - docker compose down gateway

  gateway:logs:
    desc: Show Gateway service logs
    cmds:
      - docker compose logs -f gateway

  gateway:restart:
    desc: Restart Gateway service (rebuild without cache and start)
    deps: [vendor]
    cmds:
      - docker compose build gateway --no-cache
      - docker compose up -d gateway

  # ============================================================
  #  ОБЩИЕ ЗАДАЧИ ДЛЯ ВСЕГО DOCKER-СТЕКА
  # ============================================================

  docker-up:
    desc: Start all services (app + monitoring + logging)
    cmds:
      - docker compose up -d --build
      - echo "✅ All services started! (postgres-auth, redis-auth, migrate-auth, auth, gateway, prometheus, grafana, loki, promtail)"

  docker-down:
    desc: Stop all services
    cmds:
      - docker compose down

  docker-down-v:
    desc: Stop all services and remove volumes
    cmds:
      - docker compose down -v

  # ============================================================
  #  МОНИТОРИНГ (Prometheus + Grafana)
  # ============================================================

  monitoring-up:
    desc: Start Prometheus and Grafana
    cmds:
      - docker compose up -d prometheus grafana

  monitoring-down:
    desc: Stop Prometheus and Grafana
    cmds:
      - docker compose down prometheus grafana

  monitoring-logs:
    desc: Show logs from Prometheus and Grafana
    cmds:
      - docker compose logs -f prometheus grafana

  # ============================================================
  #  ЛОГИ (Loki + Promtail)
  # ============================================================

  loki-up:
    desc: Start Loki
    cmds:
      - docker compose up -d loki

  loki-down:
    desc: Stop Loki
    cmds:
      - docker compose down loki

  loki-logs:
    desc: Show Loki logs
    cmds:
      - docker compose logs -f loki

  promtail-up:
    desc: Start Promtail
    cmds:
      - docker compose up -d promtail

  promtail-down:
    desc: Stop Promtail
    cmds:
      - docker compose down promtail

  promtail-logs:
    desc: Show Promtail logs
    cmds:
      - docker compose logs -f promtail

  logging-up:
    desc: Start Loki and Promtail
    cmds:
      - docker compose up -d loki promtail

  logging-down:
    desc: Stop Loki and Promtail
    cmds:
      - docker compose down loki promtail

  logging-logs:
    desc: Show logs from Loki and Promtail
    cmds:
      - docker compose logs -f loki promtail