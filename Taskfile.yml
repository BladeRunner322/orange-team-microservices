version: '3'

dotenv: ['.env']

env:
  COMPOSE_FILE: infra/compose.app.yml:infra/compose.infra.yml
  COMPOSE_ENV_FILES: .env

includes:
  auth:      ./taskfiles/auth.yml
  gateway:   ./taskfiles/gateway.yml
  profiles:  ./taskfiles/profiles.yml
  exercises: ./taskfiles/exercises.yml

tasks:
  # ============================================================
  #  ГЕНЕРАЦИЯ
  # ============================================================

  generate:
    desc: Generate gRPC code from proto files
    cmds:
      - protoc -I api --go_out=. --go-grpc_out=. $(find api -name '*.proto')

  gen-certs:
    desc: Generate self-signed TLS certificates for development
    cmds:
      - mkdir -p certs
      - openssl req -x509 -newkey rsa:4096 -keyout certs/server.key -out certs/server.crt -days 365 -nodes -subj "/CN=localhost"

  # ============================================================
  #  ТЕСТЫ
  # ============================================================

  test:
    desc: Run unit tests (compact — one line per package with coverage)
    cmds: [go test -short -cover ./...]

  test-verbose:
    desc: Run unit tests with verbose per-test output
    cmds: [go test -v ./...]

  test-integration:
    desc: Run integration tests with Testcontainers
    cmds: [go test -tags=integration -v ./...]

  test-all:
    desc: Run unit and integration tests
    cmds:
      - task: test
      - task: test-integration

  test-cover-summary:
    desc: Coverage table per function with total (compact terminal output)
    cmds:
      - mkdir -p coverage
      - go test -short -coverprofile=coverage/coverage.out ./... > /dev/null
      - go tool cover -func=coverage/coverage.out

  test-cover-worst:
    desc: 20 least-covered functions (where to write tests next)
    cmds:
      - mkdir -p coverage
      - go test -short -coverprofile=coverage/coverage.out ./... > /dev/null
      - go tool cover -func=coverage/coverage.out | sort -k3 -n | head -20

  test-cover:
    desc: HTML coverage report with line-by-line highlighting
    cmds:
      - mkdir -p coverage
      - go test -short -coverprofile=coverage/coverage.out ./...
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "Coverage report saved to coverage/coverage.html"

  # ============================================================
  #  DOCKER
  # ============================================================

  docker-up:
    desc: Start all services (app + infra)
    deps: [secrets:generate]
    cmds: [docker compose up -d --build]

  docker-down:
    desc: Stop all services
    cmds: [docker compose down]

  docker-down-v:
    desc: Stop all services and remove volumes
    cmds: [docker compose down -v]

  app-up:
    desc: Start only application services (no infra)
    cmds: [docker compose -f infra/compose.app.yml --env-file .env up -d --build]

  app-down:
    desc: Stop only application services
    cmds: [docker compose -f infra/compose.app.yml --env-file .env down]

  infra-up:
    desc: Start only infrastructure services (no app)
    cmds: [docker compose -f infra/compose.infra.yml --env-file .env up -d]

  infra-down:
    desc: Stop only infrastructure services
    cmds: [docker compose -f infra/compose.infra.yml --env-file .env down]

  # ============================================================
  #  СЕКРЕТЫ
  # ============================================================

  sops:encrypt:
    desc: Encrypt all .env and rclone.conf files (SOPS + age)
    cmds:
      - sops --encrypt --input-type dotenv --filename-override .env .env > .env.enc
      - sops --encrypt --input-type dotenv --filename-override services/auth/.env services/auth/.env > services/auth/.env.enc
      - sops --encrypt --input-type dotenv --filename-override services/gateway/.env services/gateway/.env > services/gateway/.env.enc
      - sops --encrypt --input-type dotenv --filename-override services/profiles/.env services/profiles/.env > services/profiles/.env.enc
      - sops --encrypt --input-type dotenv --filename-override services/exercises/.env services/exercises/.env > services/exercises/.env.enc
      - sops --encrypt --input-type binary --filename-override scripts/rclone.conf scripts/rclone.conf > scripts/rclone.conf.enc

  sops:decrypt:
    desc: Decrypt all .enc files to plain
    cmds:
      - sops --decrypt --input-type dotenv --filename-override .env .env.enc > .env
      - sops --decrypt --input-type dotenv --filename-override services/auth/.env services/auth/.env.enc > services/auth/.env
      - sops --decrypt --input-type dotenv --filename-override services/gateway/.env services/gateway/.env.enc > services/gateway/.env
      - sops --decrypt --input-type dotenv --filename-override services/profiles/.env services/profiles/.env.enc > services/profiles/.env
      - sops --decrypt --input-type dotenv --filename-override services/exercises/.env services/exercises/.env.enc > services/exercises/.env
      - sops --decrypt --input-type binary --filename-override scripts/rclone.conf scripts/rclone.conf.enc > scripts/rclone.conf

  secrets:generate:
    desc: Generate secrets files for local containers from .env
    cmds:
      - mkdir -p secrets
      - |
        set -a
        . ./.env
        set +a
        printf '%s' "$TELEGRAM_BOT_TOKEN" > secrets/bot_token
        printf '%s' "$TELEGRAM_CHAT_ID"   > secrets/chat_id
        chmod 644 secrets/bot_token secrets/chat_id