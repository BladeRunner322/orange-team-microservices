version: '3'
dotenv: ['.env']

tasks:
  # ============================================================
  #  ГЕНЕРАЦИЯ И ЗАВИСИМОСТИ
  # ============================================================
  generate:
    desc: Generate gRPC code from proto files
    cmds:
      - protoc -I api --go_out=. --go-grpc_out=. api/auth/auth.proto

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  vendor:
    desc: Update vendor directory with current dependencies
    cmds:
      - go mod vendor

  # ============================================================
  #  ЗАПУСК ЛОКАЛЬНО
  # ============================================================
  run-auth:
    desc: Run auth service
    deps: [generate, tidy]
    cmds:
      - go run services/auth/cmd/main.go

  # ============================================================
  #  ТЕСТЫ
  # ============================================================
  test:
    desc: Run all unit tests with verbose output
    cmds:
      - go test -v ./...

  test-cover:
    desc: Run tests with coverage report
    cmds:
      - mkdir -p coverage
      - go test -v -coverprofile=coverage/coverage.out ./...
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "Coverage report saved to coverage/coverage.html"

  test-integration:
    desc: Run integration tests with Testcontainers
    cmds:
      - go test -tags=integration -v ./...

  # ============================================================
  #  POSTGRES (локальный контейнер)
  # ============================================================
  postgres-up:
    desc: Start PostgreSQL in background
    cmds:
      - docker compose up -d postgres

  postgres-down:
    desc: Stop and remove PostgreSQL container
    cmds:
      - docker compose down postgres

  postgres-logs:
    desc: Show PostgreSQL logs
    cmds:
      - docker compose logs -f postgres

  postgres-psql:
    desc: Open psql console
    cmds:
      - docker compose exec postgres psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}

  # ============================================================
  #  МИГРАЦИИ (golang-migrate)
  # ============================================================
  migrate-create:
    desc: Create a new migration
    cmds:
      - docker compose run --rm migrate create -ext sql -dir /migrations -seq {{.CLI_ARGS}}

  migrate-up:
    desc: Apply all pending migrations
    cmds:
      - docker compose run --rm migrate -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" up

  migrate-down:
    desc: Rollback the last migration
    cmds:
      - docker compose run --rm migrate -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" down {{.CLI_ARGS}}

  migrate-version:
    desc: Show current migration version
    cmds:
      - docker compose run --rm migrate -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" version

  # ============================================================
  #  DOCKER COMPOSE (AUTH)
  # ============================================================
  auth-build:
    desc: Build auth service Docker image
    cmds:
      - docker compose build auth

  auth-rebuild:
    desc: Rebuild auth with fresh vendor and no cache
    deps: [vendor]
    cmds:
      - docker compose build auth --no-cache

  auth-up:
    desc: Start auth service (assumes image is already built)
    cmds:
      - docker compose up -d auth

  auth-down:
    desc: Stop auth service
    cmds:
      - docker compose down auth

  auth-logs:
    desc: Show auth service logs
    cmds:
      - docker compose logs -f auth

  auth-restart:
    desc: Restart auth service (update vendor, rebuild without cache and start)
    deps: [vendor]
    cmds:
      - docker compose build auth --no-cache
      - docker compose up -d auth

  # ============================================================
  #  ALL DOCKER-COMPOSE SERVICES
  # ============================================================
  docker-up:
    desc: Start all services (app + monitoring + logging)
    cmds:
      - docker compose up -d --build
      - echo "✅ All services started! (postgres, migrate, auth, prometheus, grafana, loki, promtail)"

  docker-down:
    desc: Stop all services
    cmds:
      - docker compose down

  docker-down-v:
    desc: Stop all services and remove volumes
    cmds:
      - docker compose down -v

  # ============================================================
  #  МОНИТОРИНГ (Prometheus + Grafana)
  # ============================================================
  monitoring-up:
    desc: Start Prometheus and Grafana
    cmds:
      - docker compose up -d prometheus grafana

  monitoring-down:
    desc: Stop Prometheus and Grafana
    cmds:
      - docker compose down prometheus grafana

  monitoring-logs:
    desc: Show logs from Prometheus and Grafana
    cmds:
      - docker compose logs -f prometheus grafana

  # ============================================================
  #  ЛОГИ (Loki + Promtail)
  # ============================================================
  loki-up:
    desc: Start Loki
    cmds:
      - docker compose up -d loki

  loki-down:
    desc: Stop Loki
    cmds:
      - docker compose down loki

  loki-logs:
    desc: Show Loki logs
    cmds:
      - docker compose logs -f loki

  promtail-up:
    desc: Start Promtail
    cmds:
      - docker compose up -d promtail

  promtail-down:
    desc: Stop Promtail
    cmds:
      - docker compose down promtail

  promtail-logs:
    desc: Show Promtail logs
    cmds:
      - docker compose logs -f promtail

  logging-up:
    desc: Start Loki and Promtail
    cmds:
      - docker compose up -d loki promtail

  logging-down:
    desc: Stop Loki and Promtail
    cmds:
      - docker compose down loki promtail

  logging-logs:
    desc: Show logs from Loki and Promtail
    cmds:
      - docker compose logs -f loki promtail