version: '3'
dotenv: ['.env']

tasks:
  generate:
    desc: Generate gRPC code from proto files
    cmds:
      - protoc -I api --go_out=. --go-grpc_out=. api/auth/auth.proto

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  run-auth:
    desc: Run auth service
    deps: [generate, tidy]
    cmds:
      - go run services/auth/cmd/main.go

  test:
    desc: Run all unit tests with verbose output
    cmds:
      - go test -v ./...

  test-cover:
    desc: Run tests with coverage report
    cmds:
      - mkdir -p coverage
      - go test -v -coverprofile=coverage/coverage.out ./...
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "Coverage report saved to coverage/coverage.html"

  postgres-up:
    desc: Start PostgreSQL in background
    cmds:
      - docker compose up -d postgres

  postgres-down:
    desc: Stop and remove PostgreSQL container
    cmds:
      - docker compose down postgres

  postgres-logs:
    desc: Show PostgreSQL logs
    cmds:
      - docker compose logs -f postgres

  postgres-psql:
    desc: Open psql console
    cmds:
      - docker compose exec postgres psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}

  migrate-create:
    desc: Create a new migration
    cmds:
      - docker compose run --rm migrate create -ext sql -dir /migrations -seq {{.CLI_ARGS}}

  migrate-up:
    desc: Apply all pending migrations
    cmds:
      - docker compose run --rm migrate -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" up

  migrate-down:
    desc: Rollback the last migration
    cmds:
      - docker compose run --rm migrate -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" down {{.CLI_ARGS}}

  migrate-version:
    desc: Show current migration version
    cmds:
      - docker compose run --rm migrate -path /migrations -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" version