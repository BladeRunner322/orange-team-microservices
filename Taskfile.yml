version: '3'

tasks:
  generate:
    desc: Generate gRPC code from proto files
    cmds:
      - protoc -I api --go_out=. --go-grpc_out=. api/auth/auth.proto

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  run-auth:
    desc: Run auth service
    deps: [generate, tidy]
    cmds:
      - go run services/auth/cmd/main.go

  # ===== ТЕСТЫ =====
  test:
    desc: Run all unit tests with verbose output
    cmds:
      - go test -v ./...

  test-cover:
    desc: Run tests with coverage report
    cmds:
      - mkdir -p coverage
      - go test -v -coverprofile=coverage/coverage.out ./...
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "Coverage report saved to coverage/coverage.html"