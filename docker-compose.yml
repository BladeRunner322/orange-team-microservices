services:
  # ============================================================
  #  AUTH SERVICE – POSTGRES
  # ============================================================
  postgres-auth:
    image: postgres:18.6-bookworm
    container_name: auth-postgres
    env_file:
      - ./services/auth/.env
    ports:
      - "127.0.0.1:${AUTH_POSTGRES_PORT}:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  AUTH SERVICE – REDIS (refresh tokens)
  # ============================================================
  redis-auth:
    image: redis:7-alpine
    container_name: auth-redis
    env_file:
      - ./services/auth/.env
    ports:
      - "127.0.0.1:${AUTH_REDIS_PORT}:6379"
    volumes:
      - redisdata-auth:/data
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  AUTH SERVICE – МИГРАЦИИ
  # ============================================================
  migrate-auth:
    image: migrate/migrate:v4.19.1
    container_name: auth-migrate
    volumes:
      - ./services/auth/migrations:/migrations
    env_file:
      - ./services/auth/.env
    entrypoint: sh
    command: -c 'migrate -path /migrations -database "postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres-auth:5432/$$POSTGRES_DB?sslmode=disable" up'
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: "no"

  # ============================================================
  #  AUTH SERVICE – gRPC СЕРВЕР
  # ============================================================
  auth:
    image: ghcr.io/bladerunner322/orange-team-microservices/auth:latest
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    volumes:
      - ./certs:/app/certs:ro
    env_file:
      - ./services/auth/.env
    ports:
      - "127.0.0.1:${AUTH_GRPC_PORT}:50051"
      - "127.0.0.1:${AUTH_HTTP_PORT}:8080"
    environment:
      - POSTGRES_HOST=postgres-auth
      - TLS_CERT_FILE=/app/certs/server.crt
      - TLS_KEY_FILE=/app/certs/server.key
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      migrate-auth:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  #  GATEWAY SERVICE – REDIS (rate limiting)
  # ============================================================
  redis-gateway:
    image: redis:7-alpine
    container_name: gateway-redis
    env_file:
      - ./services/gateway/.env
    ports:
      - "127.0.0.1:${GATEWAY_REDIS_PORT}:6379"
    volumes:
      - redisdata-gateway:/data
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  GATEWAY SERVICE – HTTP
  # ============================================================
  gateway:
    image: ghcr.io/bladerunner322/orange-team-microservices/gateway:latest
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway-service
    env_file:
      - ./services/gateway/.env
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT}:8081"
    depends_on:
      auth:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
      profiles:
        condition: service_healthy
      exercises:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  #  PROFILES SERVICE – POSTGRES
  # ============================================================
  postgres-profiles:
    image: postgres:18.6-bookworm
    container_name: profiles-postgres
    env_file:
      - ./services/profiles/.env
    ports:
      - "127.0.0.1:${PROFILES_POSTGRES_PORT}:5432"
    volumes:
      - pgdata-profiles:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  PROFILES SERVICE – МИГРАЦИИ
  # ============================================================
  migrate-profiles:
    image: migrate/migrate:v4.19.1
    container_name: profiles-migrate
    volumes:
      - ./services/profiles/migrations:/migrations
    env_file:
      - ./services/profiles/.env
    entrypoint: sh
    command: -c 'migrate -path /migrations -database "postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres-profiles:5432/$$POSTGRES_DB?sslmode=disable" up'
    depends_on:
      postgres-profiles:
        condition: service_healthy
    restart: "no"

  # ============================================================
  #  PROFILES SERVICE – gRPC СЕРВЕР
  # ============================================================
  profiles:
    image: ghcr.io/bladerunner322/orange-team-microservices/profiles:latest
    build:
      context: .
      dockerfile: services/profiles/Dockerfile
    container_name: profiles-service
    volumes:
      - ./certs:/app/certs:ro
    env_file:
      - ./services/profiles/.env
    ports:
      - "127.0.0.1:${PROFILES_GRPC_PORT}:50052"
      - "127.0.0.1:${PROFILES_HTTP_PORT}:8080"
    environment:
      - POSTGRES_HOST=postgres-profiles
      - TLS_CERT_FILE=/app/certs/server.crt
      - TLS_KEY_FILE=/app/certs/server.key
    depends_on:
      postgres-profiles:
        condition: service_healthy
      migrate-profiles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  #  EXERCISES SERVICE – POSTGRES
  # ============================================================
  postgres-exercises:
    image: postgres:18.6-bookworm
    container_name: exercises-postgres
    env_file:
      - ./services/exercises/.env
    ports:
      - "127.0.0.1:${EXERCISES_POSTGRES_PORT}:5432"
    volumes:
      - pgdata-exercises:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  EXERCISES SERVICE – МИГРАЦИИ
  # ============================================================
  migrate-exercises:
    image: migrate/migrate:v4.19.1
    container_name: exercises-migrate
    volumes:
      - ./services/exercises/migrations:/migrations
    env_file:
      - ./services/exercises/.env
    entrypoint: sh
    command: -c 'migrate -path /migrations -database "postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres-exercises:5432/$$POSTGRES_DB?sslmode=disable" up'
    depends_on:
      postgres-exercises:
        condition: service_healthy
    restart: "no"

  # ============================================================
  #  EXERCISES SERVICE – gRPC СЕРВЕР
  # ============================================================
  exercises:
    image: ghcr.io/bladerunner322/orange-team-microservices/exercises:latest
    build:
      context: .
      dockerfile: services/exercises/Dockerfile
    container_name: exercises-service
    volumes:
      - ./certs:/app/certs:ro
    env_file:
      - ./services/exercises/.env
    ports:
      - "127.0.0.1:${EXERCISES_GRPC_PORT}:50053"
      - "127.0.0.1:${EXERCISES_HTTP_PORT}:8080"
    environment:
      - POSTGRES_HOST=postgres-exercises
      - TLS_CERT_FILE=/app/certs/server.crt
      - TLS_KEY_FILE=/app/certs/server.key
    depends_on:
      postgres-exercises:
        condition: service_healthy
      migrate-exercises:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  #  CADDY — HTTPS-терминация + reverse proxy на Gateway
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy

  # ============================================================
  #  МОНИТОРИНГ (Prometheus + Grafana)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: auth-prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      auth:
        condition: service_healthy
      gateway:
        condition: service_healthy
      profiles:
        condition: service_healthy
      exercises:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT}:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - warp
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host

  grafana:
    image: grafana/grafana:latest
    container_name: auth-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

  # ============================================================
  #  ЛОГИ (Loki + Promtail)
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: auth-loki
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: auth-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Cloudflare WARP — SOCKS5-прокси для обхода блокировок
  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 1.0.0.1

volumes:
  # PostgreSQL
  pgdata-auth:
  pgdata-profiles:
  pgdata-exercises:

  # Redis
  redisdata-auth:
  redisdata-gateway:

  # Grafana
  grafana-storage:

  # Caddy
  caddy_data:
  caddy_config:

  # Alertmanager
  alertmanager_data: