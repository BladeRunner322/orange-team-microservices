services:
  # ============================================================
  #  AUTH SERVICE – POSTGRES
  # ============================================================
  postgres-auth:
    image: postgres:18.6-bookworm
    container_name: auth-postgres
    env_file:
      - ./services/auth/.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  AUTH SERVICE – REDIS (refresh tokens)
  # ============================================================
  redis-auth:
    image: redis:7-alpine
    container_name: auth-redis
    env_file:
      - ./services/auth/.env
    ports:
      - "${REDIS_AUTH_PORT}:6379"
    volumes:
      - redisdata-auth:/data
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  AUTH SERVICE – МИГРАЦИИ
  # ============================================================
  migrate-auth:
    image: migrate/migrate:v4.19.1
    container_name: auth-migrate
    volumes:
      - ./services/auth/migrations:/migrations
    env_file:
      - ./services/auth/.env
    entrypoint: sh
    command: -c 'migrate -path /migrations -database "postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres-auth:5432/$$POSTGRES_DB?sslmode=disable" up'
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: "no"

  # ============================================================
  #  AUTH SERVICE – gRPC СЕРВЕР
  # ============================================================
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    volumes:
      - ./certs:/app/certs:ro
    env_file:
      - ./services/auth/.env
    ports:
      - "${AUTH_GRPC_PORT}:50051"
      - "${AUTH_HTTP_PORT}:8080"
    environment:
      - POSTGRES_HOST=postgres-auth
      - TLS_CERT_FILE=/app/certs/server.crt
      - TLS_KEY_FILE=/app/certs/server.key
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      migrate-auth:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  #  GATEWAY SERVICE – REDIS (rate limiting)
  # ============================================================
  redis-gateway:
    image: redis:7-alpine
    container_name: gateway-redis
    env_file:
      - ./services/gateway/.env
    ports:
      - "${REDIS_GATEWAY_PORT}:6379"
    volumes:
      - redisdata-gateway:/data
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  #  GATEWAY SERVICE – HTTP
  # ============================================================
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway-service
    env_file:
      - ./services/gateway/.env
    ports:
      - "${GATEWAY_HTTP_PORT}:8081"
    depends_on:
      auth:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  #  МОНИТОРИНГ (Prometheus + Grafana)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: auth-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: auth-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

  # ============================================================
  #  ЛОГИ (Loki + Promtail)
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: auth-loki
    ports:
      - "${LOKI_PORT}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: auth-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  redisdata-auth:
  redisdata-gateway:
  grafana-storage: