global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      # bot_token_file / chat_id_file — читают секреты из отдельных файлов.
      # Alertmanager НЕ подставляет ${VAR} в конфиг (в отличие от docker-compose).
      # Файлы создаёт CD на сервере из расшифрованного .env, в git не попадают.
      - bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id_file: /etc/alertmanager/secrets/chat_id
        parse_mode: 'HTML'
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          <b>Severity:</b> {{ .Labels.severity }}
          {{ if .Annotations.summary }}<b>Summary:</b> {{ .Annotations.summary }}{{ end }}
          {{ if .Annotations.description }}<b>Description:</b> {{ .Annotations.description }}{{ end }}
          {{ end }}